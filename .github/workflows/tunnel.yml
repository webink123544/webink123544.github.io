name: TCP Relay Service

on:
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y socat curl
          curl -L https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo mv bore /usr/local/bin/

      - name: Start TCP Tunnel (Aggressive No-Buffer)
        run: |
          # Используем PIPE для снижения нагрузки на localhost и агрессивные флаги
          socat -d -d -4 TCP4-LISTEN:1240,fork,reuseaddr,nodelay,rcvbuf=0,sndbuf=0 TCP4:193.24.208.6:1240,nodelay,rcvbuf=0,sndbuf=0 &
          bore local 1240 --to bore.pub
