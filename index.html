<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anarchy Relay & WebRX</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; 
        }
        
        body { 
            background: #050505; 
            color: #d4d4d4; 
            display: flex; 
            min-height: 100vh; 
            position: relative; 
            font-size: 0.85rem;
            overflow: hidden;
        }
        
        /* Главный контейнер для разделения на Receiver и Chat */
        .app-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        .sdr-panel {
            flex: 1;
            height: 100%;
            background: #000;
            border-right: 1px solid #1f1f1f;
        }

        .sdr-panel iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .warning-popup {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #991b1b;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 2px;
            font-weight: bold;
            box-shadow: 0 2px 10px rgba(153, 27, 27, 0.4);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            animation: fadeOut 0.5s ease 3s forwards;
            pointer-events: none;
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        .auth-overlay, .banned-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000;
        }

        .banned-overlay { z-index: 3000; }

        .auth-box, .banned-box {
            background: #0a0a0a;
            padding: 20px;
            border-radius: 2px;
            border: 1px solid #1f1f1f;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        .banned-box { border-color: #991b1b; }
        .banned-box h2 { color: #dc2626; margin-bottom: 10px; font-size: 1.1rem; letter-spacing: 1px; }
        .banned-box p { color: #888; font-size: 0.8rem; margin-bottom: 5px; }
        .time-left-text { color: #ef4444; font-weight: bold; font-size: 0.9rem; margin-bottom: 15px; }

        .auth-box h2 { margin-bottom: 15px; color: #dc2626; letter-spacing: 1px; font-size: 1.1rem; }
        .auth-box input { width: 100%; margin-bottom: 10px; }
        .auth-box button { width: 100%; margin-bottom: 10px; }
        .auth-toggle { font-size: 0.75rem; color: #666; cursor: pointer; text-decoration: underline; }
        .auth-toggle:hover { color: #aaa; }

        .chat-container { 
            width: 420px; 
            height: 100vh; 
            background: #080808; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            border-left: 1px solid #1f1f1f;
        }
        
        .chat-header { 
            background: #0a0a0a; 
            padding: 12px 16px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: normal; 
            font-size: 0.85rem;
            border-bottom: 1px solid #1f1f1f; 
            color: #888;
        }

        .header-title {
            color: #dc2626;
            letter-spacing: 1px;
            font-weight: bold;
        }
        
        .messages { 
            flex: 1; 
            padding: 16px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            background: #000000;
        }
        
        .msg { 
            background: #0a0a0a; 
            padding: 8px 12px; 
            border-radius: 2px; 
            max-width: 90%; 
            width: fit-content; 
            word-break: break-word; 
            border: 1px solid #161616;
            color: #d4d4d4;
            font-size: 0.8rem;
            line-height: 1.4;
        }

        .msg img.chat-image {
            max-width: 100%;
            max-height: 250px;
            border-radius: 2px;
            margin-top: 6px;
            display: block;
            border: 1px solid #222;
        }
        
        .msg .name { 
            font-size: 0.75rem; 
            color: #ef4444; 
            font-weight: bold; 
            margin-bottom: 4px; 
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .user-tag {
            font-size: 0.6rem;
            padding: 2px 4px;
            border-radius: 2px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tag-owner { background: #991b1b; color: #ffffff; }
        .tag-admin { background: #c2410c; color: #ffffff; }
        .tag-mod { background: #15803d; color: #ffffff; }
        .tag-default { background: #1f2937; color: #9ca3af; }
        
        .mod-actions {
            margin-top: 6px;
            display: flex;
            gap: 4px;
        }

        .btn-mod {
            background: #1a1a1a;
            color: #888;
            border: 1px solid #2a2a2a;
            padding: 2px 6px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 0.65rem;
        }
        .btn-mod:hover { background: #2a2a2a; color: #ccc; }
        .btn-danger:hover { background: #991b1b; color: #fff; border-color: #991b1b; }

        .input-area { 
            display: flex; 
            padding: 10px; 
            background: #0a0a0a; 
            gap: 6px; 
            border-top: 1px solid #1f1f1f;
            align-items: center;
        }
        
        input[type="text"], input[type="password"] { 
            padding: 8px 12px; 
            border: 1px solid #1f1f1f; 
            border-radius: 2px; 
            background: #050505; 
            color: #d4d4d4; 
            outline: none; 
            font-size: 0.8rem;
            transition: border-color 0.2s;
        }
        
        input[type="text"]:focus, input[type="password"]:focus { border-color: #ef4444; }
        
        .img-upload-btn {
            background: #161616;
            color: #888;
            padding: 8px 12px;
            border-radius: 2px;
            cursor: pointer;
            border: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .img-upload-btn:hover { background: #2a2a2a; color: #ccc; }

        button { 
            padding: 8px 16px; 
            border: none; 
            border-radius: 2px; 
            background: #991b1b; 
            color: #ffffff; 
            font-weight: bold; 
            font-size: 0.8rem;
            cursor: pointer; 
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        button:hover { background: #7f1d1d; }
        .btn-small { padding: 4px 8px; font-size: 0.7rem; }

        #sendBtn {
            padding: 8px 14px;
        }

        @media (max-width: 900px) {
            .app-layout {
                flex-direction: column;
            }
            .chat-container {
                width: 100%;
                height: 50vh;
            }
            .sdr-panel {
                height: 50vh;
            }
        }
    </style>
</head>
<body>

<div class="warning-popup" id="warning">
    [!] UNMODERATED ZONE: PROCEED WITH CAUTION
</div>

<div class="banned-overlay" id="bannedOverlay" style="display: none;">
    <div class="banned-box">
        <h2>ACCESS RESTRICTED</h2>
        <p id="banReasonText">Connection rejected by host.</p>
        <div id="banTimeLeft" class="time-left-text">Calculating...</div>
        <button id="bannedLogoutBtn">Disconnect</button>
    </div>
</div>

<div class="auth-overlay" id="authOverlay">
    <div class="auth-box">
        <h2 id="authTitle">A U T H E N T I C A T E</h2>
        <input type="text" id="authUsername" placeholder="Root ID (Username)" autocomplete="off">
        <input type="text" id="authNickname" placeholder="Display Alias" autocomplete="off" style="display:none;">
        <input type="password" id="authPin" placeholder="4-Digit PIN Key" maxlength="8" autocomplete="off">
        <input type="text" id="authRecoveryCode" placeholder="Override Code" style="display:none;" autocomplete="off">
        
        <button id="authPrimaryBtn">Initialize</button>
        <p class="auth-toggle" id="authResetToggle" style="margin-bottom: 8px;">Lost PIN? Initiate Override</p>
        <p class="auth-toggle" id="authModeToggle">New Identity? Register</p>
    </div>
</div>

<div class="app-layout">
    <div class="sdr-panel">
        <iframe src="https://openwebrx-relay-b2tpg.sprites.app/#freq=4625000,mod=usb,sql=-150" allow="autoplay"></iframe>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <span class="header-title">[ ANARCHY_NET // RELAY_01 ]</span>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span id="currentUser" style="font-size: 0.75rem; color: #666;"></span>
                <button id="changeNickBtn" class="btn-small" style="background:#1f2937;">Alias</button>
                <button id="logoutBtn" class="btn-small">Exit</button>
            </div>
        </div>
        <div class="messages" id="messages"></div>
        <form class="input-area" id="chatForm" onsubmit="return false;" autocomplete="off">
            <label class="img-upload-btn" title="Upload Image">
                [IMG]
                <input type="file" id="imgInput" accept="image/*" style="display: none;">
            </label>
            <input type="text" id="msgInput" placeholder="Broadcast message..." style="flex: 1;" autocomplete="off">
            <button id="sendBtn" type="button" title="Send Message">SEND</button>
        </form>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onChildChanged, onChildRemoved, get, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDFzJR2Yg2Z5VS5PEX7S8fDBTS8J49hfJM",
        authDomain: "chatprojecttest-fed60.firebaseapp.com",
        databaseURL: "https://chatprojecttest-fed60-default-rtdb.firebaseio.com/", 
        projectId: "chatprojecttest-fed60",
        storageBucket: "chatprojecttest-fed60.firebasestorage.app",
        messagingSenderId: "888428258274",
        appId: "1:888428258274:web:bc3a453ba34208992f4fbb",
        measurementId: "G-GTY7Y12J65"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'global_messages');

    const authOverlay = document.getElementById('authOverlay');
    const bannedOverlay = document.getElementById('bannedOverlay');
    const banReasonText = document.getElementById('banReasonText');
    const banTimeLeft = document.getElementById('banTimeLeft');
    const bannedLogoutBtn = document.getElementById('bannedLogoutBtn');
    
    const authTitle = document.getElementById('authTitle');
    const authUsername = document.getElementById('authUsername');
    const authNickname = document.getElementById('authNickname');
    const authPin = document.getElementById('authPin');
    const authRecoveryCode = document.getElementById('authRecoveryCode');
    const authPrimaryBtn = document.getElementById('authPrimaryBtn');
    const authModeToggle = document.getElementById('authModeToggle');
    const authResetToggle = document.getElementById('authResetToggle');
    const currentUserDisplay = document.getElementById('currentUser');
    const logoutBtn = document.getElementById('logoutBtn');
    const changeNickBtn = document.getElementById('changeNickBtn');
    
    const messagesContainer = document.getElementById('messages');
    const msgInput = document.getElementById('msgInput');
    const imgInput = document.getElementById('imgInput');
    const sendBtn = document.getElementById('sendBtn');

    let currentMode = 'login';
    let activeUser = localStorage.getItem('anarchy_username') || null;
    let currentUserData = { accessLevel: 1, tag: 'MEMBER', nickname: 'Anon', muted: false, banned: false };
    let banTimerInterval = null;

    async function initDatabaseFiles() {
        const files = ['TTLS.txt', 'ACL.txt', 'LOGS.txt'];
        for (const file of files) {
            const fileRef = ref(db, `system_files/${file.replace('.', '_')}`);
            const snap = await get(fileRef);
            if (!snap.exists()) {
                await set(fileRef, `[INITIALIZED ${file} AT ${new Date().toISOString()}]\n`);
            }
        }
    }
    initDatabaseFiles();

    function formatTimeLeft(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const d = Math.floor(totalSeconds / 86400);
        const h = Math.floor((totalSeconds % 86400) / 3600);
        const m = Math.floor((totalSeconds % 3600) / 60);
        const s = totalSeconds % 60;
        let res = "";
        if (d > 0) res += d + "d ";
        if (h > 0) res += h + "h ";
        if (m > 0) res += m + "m ";
        res += s + "s";
        return res.trim();
    }

    function checkBanStatus() {
        if (banTimerInterval) clearInterval(banTimerInterval);

        if (currentUserData.banned) {
            if (currentUserData.banExpires !== -1 && Date.now() > currentUserData.banExpires) {
                update(ref(db, `users/${activeUser}`), { banned: false });
                bannedOverlay.style.display = 'none';
                return;
            }

            banReasonText.textContent = `Reason: ${currentUserData.banReason || 'SysAdmin Override'}`;
            bannedOverlay.style.display = 'flex';

            if (currentUserData.banExpires === -1) {
                banTimeLeft.textContent = "Lock: PERMANENT";
            } else {
                banTimerInterval = setInterval(updateBanTimer, 1000);
                updateBanTimer(); 
            }
        } else {
            bannedOverlay.style.display = 'none';
        }
    }

    function updateBanTimer() {
        if (!currentUserData.banned || currentUserData.banExpires === -1) return;
        const remaining = currentUserData.banExpires - Date.now();
        if (remaining <= 0) {
            clearInterval(banTimerInterval);
            checkBanStatus();
        } else {
            banTimeLeft.textContent = "T-Minus: " + formatTimeLeft(remaining);
        }
    }

    function isMuted() {
        if (!currentUserData.muted) return false;
        if (currentUserData.muteExpires !== -1 && Date.now() > currentUserData.muteExpires) {
            update(ref(db, `users/${activeUser}`), { muted: false });
            currentUserData.muted = false; 
            return false;
        }
        return true;
    }

    function listenToUserStatus(username) {
        onValue(ref(db, `users/${username}`), (snapshot) => {
            if (snapshot.exists()) {
                currentUserData = snapshot.val();
                currentUserData.accessLevel = parseInt(currentUserData.accessLevel || 1);
                currentUserDisplay.textContent = `${currentUserData.nickname} (@${username}) [Lvl:${currentUserData.accessLevel}]`;
                checkBanStatus();
            }
        });
    }

    if (activeUser) {
        authOverlay.style.display = 'none';
        listenToUserStatus(activeUser);
    }

    setTimeout(() => {
        const warning = document.getElementById('warning');
        if (warning) warning.remove();
    }, 3500);

    authModeToggle.addEventListener('click', () => {
        if (currentMode === 'login') {
            currentMode = 'register';
            authTitle.textContent = 'N E W    I D E N T I T Y';
            authPrimaryBtn.textContent = 'Register';
            authModeToggle.textContent = 'Return to Auth';
            authNickname.style.display = 'block';
            authRecoveryCode.style.display = 'none';
        } else {
            currentMode = 'login';
            authTitle.textContent = 'A U T H E N T I C A T E';
            authPrimaryBtn.textContent = 'Initialize';
            authModeToggle.textContent = 'New Identity? Register';
            authNickname.style.display = 'none';
            authRecoveryCode.style.display = 'none';
        }
    });

    authResetToggle.addEventListener('click', () => {
        currentMode = 'reset';
        authTitle.textContent = 'P I N    O V E R R I D E';
        authPrimaryBtn.textContent = 'Update Key';
        authRecoveryCode.style.display = 'block';
        authNickname.style.display = 'none';
    });

    authPrimaryBtn.addEventListener('click', async () => {
        const username = authUsername.value.trim().toLowerCase();
        const nickname = authNickname.value.trim() || username;
        const pin = authPin.value.trim();
        const recCode = authRecoveryCode.value.trim();

        if (!username || !pin) return alert("ERR: Missing parameters.");

        const userRef = ref(db, `users/${username}`);

        if (currentMode === 'register') {
            const userSnap = await get(userRef);
            if (userSnap.exists()) return alert("ERR: ID exists.");

            const recoveryCode = Math.floor(100000 + Math.random() * 900000).toString();
            
            await set(userRef, {
                username: username,
                nickname: nickname,
                pin: pin,
                recoveryCode: recoveryCode,
                tag: "MEMBER",
                accessLevel: 1,
                muted: false,
                banned: false
            });

            alert(`REGISTRATION COMPLETE\n\nSave Override Code:\n${recoveryCode}`);
            loginUser(username);
        } 
        else if (currentMode === 'login') {
            const snapshot = await get(userRef);
            if (!snapshot.exists()) return alert("ERR: Unknown ID.");
            if (snapshot.val().pin !== pin) return alert("ERR: Invalid PIN.");

            loginUser(username);
        }
        else if (currentMode === 'reset') {
            const snapshot = await get(userRef);
            if (!snapshot.exists()) return alert("ERR: Unknown ID.");
            if (snapshot.val().recoveryCode !== recCode) return alert("ERR: Invalid Override Code.");

            await update(userRef, { pin: pin });
            alert("PIN UPDATED. INITIALIZING...");
            loginUser(username);
        }
    });

    function loginUser(username) {
        activeUser = username;
        localStorage.setItem('anarchy_username', username);
        listenToUserStatus(username);
        authOverlay.style.display = 'none';
    }

    changeNickBtn.addEventListener('click', async () => {
        const newNick = prompt("Enter new Alias:", currentUserData.nickname);
        if (newNick && newNick.trim() !== "") {
            await update(ref(db, `users/${activeUser}`), { nickname: newNick.trim() });
        }
    });

    logoutBtn.addEventListener('click', performLogout);
    bannedLogoutBtn.addEventListener('click', performLogout);

    function performLogout() {
        localStorage.removeItem('anarchy_username');
        location.reload();
    }

    async function appendToTxtLog(filename, logMessage) {
        const fileKey = filename.replace('.', '_');
        const fileRef = ref(db, `system_files/${fileKey}`);
        const snap = await get(fileRef);
        const currentContent = snap.exists() ? snap.val() : "";
        const updatedContent = currentContent + `[${new Date().toLocaleString()}] ${logMessage}\n`;
        await set(fileRef, updatedContent);
    }

    imgInput.addEventListener('change', async (e) => {
        if (isMuted()) {
            const left = currentUserData.muteExpires === -1 ? "PERMANENT" : formatTimeLeft(currentUserData.muteExpires - Date.now());
            alert(`TX BLOCKED (Muted) | Clear in: ${left}`);
            imgInput.value = "";
            return;
        }

        const file = e.target.files[0];
        if (!file) return;

        if (file.size > 2 * 1024 * 1024) {
            alert("ERR: Payload exceeds 2MB limit.");
            return;
        }

        const reader = new FileReader();
        reader.onload = async () => {
            const base64Img = reader.result;
            await push(messagesRef, {
                username: activeUser,
                nickname: currentUserData.nickname || activeUser,
                userTag: currentUserData.tag || "MEMBER",
                accessLevel: currentUserData.accessLevel || 1,
                message: "",
                image: base64Img,
                timestamp: Date.now()
            });
        };
        reader.readAsDataURL(file);
        imgInput.value = "";
    });

    async function sendMessage() {
        if (!activeUser) return alert("ERR: Not authenticated.");
        if (isMuted()) {
            const left = currentUserData.muteExpires === -1 ? "PERMANENT" : formatTimeLeft(currentUserData.muteExpires - Date.now());
            return alert(`TX BLOCKED (Muted) | Clear in: ${left}`);
        }
        
        const text = msgInput.value.trim();
        if (text === "") return;

        push(messagesRef, {
            username: activeUser,
            nickname: currentUserData.nickname || activeUser,
            userTag: currentUserData.tag || "MEMBER",
            accessLevel: currentUserData.accessLevel || 1,
            message: text,
            timestamp: Date.now()
        });

        msgInput.value = "";
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    onChildAdded(messagesRef, (data) => renderMessage(data.key, data.val()));

    onChildChanged(messagesRef, (data) => {
        const existingMsg = document.getElementById(`msg-${data.key}`);
        if (existingMsg) {
            const body = existingMsg.querySelector('.msg-body');
            if (body) body.textContent = data.val().message;
        }
    });

    onChildRemoved(messagesRef, (data) => {
        const existingMsg = document.getElementById(`msg-${data.key}`);
        if (existingMsg) existingMsg.remove();
    });

    function renderMessage(msgId, msgData) {
        if (document.getElementById(`msg-${msgId}`)) return;

        const msgElement = document.createElement('div');
        msgElement.classList.add('msg');
        msgElement.id = `msg-${msgId}`;
        
        const tagText = msgData.userTag || "MEMBER";
        const level = parseInt(msgData.accessLevel || 1);
        
        let tagClass = 'tag-default';
        if (level >= 10 || tagText.toUpperCase() === 'OWNER') tagClass = 'tag-owner';
        else if (level >= 8 || tagText.toUpperCase() === 'ADMIN') tagClass = 'tag-admin';
        else if (level >= 5 || tagText.toUpperCase() === 'MOD') tagClass = 'tag-mod';

        let modButtonsHtml = '';
        const myLevel = parseInt(currentUserData.accessLevel || 1);

        if (myLevel >= 5) {
            modButtonsHtml += `<button class="btn-mod" onclick="editMsg('${msgId}')">EDIT</button>`;
            modButtonsHtml += `<button class="btn-mod btn-danger" onclick="deleteMsg('${msgId}')">DEL</button>`;
        }
        if (myLevel >= 8) {
            modButtonsHtml += `<button class="btn-mod btn-danger" onclick="punishUser('${msgData.username}', 'MUTE')">MUTE</button>`;
            modButtonsHtml += `<button class="btn-mod btn-danger" onclick="punishUser('${msgData.username}', 'BANIP')">BAN</button>`;
        }

        let imageHtml = msgData.image ? `<img src="${msgData.image}" class="chat-image" />` : '';

        msgElement.innerHTML = `
            <div class="name">
                <span>${escapeHTML(msgData.nickname)} <small style="color:#555">(@${escapeHTML(msgData.username)})</small></span>
                <span class="user-tag ${tagClass}">[${escapeHTML(tagText)}]</span>
            </div>
            ${msgData.message ? `<div class="msg-body">${escapeHTML(msgData.message)}</div>` : ''}
            ${imageHtml}
            ${modButtonsHtml ? `<div class="mod-actions">${modButtonsHtml}</div>` : ''}
        `;
        
        messagesContainer.appendChild(msgElement);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    window.editMsg = async (msgId) => {
        const newText = prompt("OVERWRITE TX:");
        if (newText && newText.trim() !== "") {
            await update(ref(db, `global_messages/${msgId}`), { message: newText.trim() });
            await appendToTxtLog('LOGS.txt', `[EDIT] User @${activeUser} edited message ID ${msgId} to: "${newText.trim()}"`);
        }
    };

    window.deleteMsg = async (msgId) => {
        if (confirm("PURGE TX?")) {
            await remove(ref(db, `global_messages/${msgId}`));
            await appendToTxtLog('LOGS.txt', `[DELETE] User @${activeUser} deleted message ID ${msgId}`);
        }
    };

    window.punishUser = async (targetUser, actionType) => {
        const durationInput = prompt(`Set ${actionType} duration in HOURS (0 = Perm, 0.5 = 30m):`, "24");
        if (durationInput === null) return;
        
        const hours = parseFloat(durationInput);
        if (isNaN(hours) || hours < 0) return alert("ERR: Invalid duration.");

        const reason = prompt(`Reason for ${actionType}:`, "TOS Violation");
        if (reason === null) return;

        const targetRef = ref(db, `users/${targetUser}`);
        const expiresAt = hours === 0 ? -1 : Date.now() + (hours * 3600 * 1000);

        if (actionType === 'MUTE') {
            await update(targetRef, { muted: true, muteReason: reason, muteExpires: expiresAt });
        } else if (actionType === 'BANIP') {
            await update(targetRef, { banned: true, banReason: reason, banExpires: expiresAt });
        }

        const logEntry = `[${actionType}] Target: @${targetUser} | Hrs: ${hours === 0 ? 'Perm' : hours} | Reason: "${reason}" | Exec: @${activeUser}`;
        await appendToTxtLog('LOGS.txt', logEntry);

        alert(`EXECUTION COMPLETE: ${actionType} applied to @${targetUser}`);
    };

    function escapeHTML(str) {
        return str ? str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)) : '';
    }
</script>

</body>
</html>
