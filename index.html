<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f3f4f6; color: #1f2937; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .chat-container { 
            width: 95%; 
            max-width: 900px; 
            height: 90vh; 
            background: #ffffff; 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); 
            border: 1px solid #e5e7eb;
        }
        
        .chat-header { 
            background: #ffffff; 
            padding: 18px 20px; 
            text-align: center; 
            font-weight: 600; 
            font-size: 1.1rem;
            border-bottom: 1px solid #e5e7eb; 
            color: #111827;
        }
        
        .messages { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            background: #fafafa;
        }
        
        .msg { 
            background: #ffffff; 
            padding: 12px 16px; 
            border-radius: 10px; 
            max-width: 75%; 
            width: fit-content; 
            word-break: break-word; 
            border: 1px solid #e5e7eb;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }
        
        .msg .name { 
            font-size: 0.85rem; 
            color: #2563eb; 
            font-weight: 600; 
            margin-bottom: 4px; 
        }
        
        .input-area { 
            display: flex; 
            padding: 16px; 
            background: #ffffff; 
            gap: 12px; 
            border-top: 1px solid #e5e7eb;
        }
        
        input { 
            padding: 12px 16px; 
            border: 1px solid #d1d5db; 
            border-radius: 8px; 
            background: #ffffff; 
            color: #111827; 
            outline: none; 
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        
        input:focus {
            border-color: #2563eb;
        }
        
        button { 
            padding: 12px 24px; 
            border: none; 
            border-radius: 8px; 
            background: #2563eb; 
            color: #ffffff; 
            font-weight: 600; 
            font-size: 0.95rem;
            cursor: pointer; 
            transition: background 0.2s;
        }
        
        button:hover { 
            background: #1d4ed8; 
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🌐 Global Chat Room</div>
    <div class="messages" id="messages"></div>
    <form class="input-area" id="chatForm" onsubmit="return false;" autocomplete="off">
        <input type="text" id="username" placeholder="Your name" style="max-width: 160px;" autocomplete="off" name="chat-user-name">
        <input type="text" id="msgInput" placeholder="Type a message..." style="flex: 1;" autocomplete="off" name="chat-message-text">
        <button id="sendBtn" type="button">Send</button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDFzJR2Yg2Z5VS5PEX7S8fDBTS8J49hfJM",
        authDomain: "chatprojecttest-fed60.firebaseapp.com",
        databaseURL: "https://chatprojecttest-fed60-default-rtdb.firebaseio.com/", 
        projectId: "chatprojecttest-fed60",
        storageBucket: "chatprojecttest-fed60.firebasestorage.app",
        messagingSenderId: "888428258274",
        appId: "1:888428258274:web:bc3a453ba34208992f4fbb",
        measurementId: "G-GTY7Y12J65"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'global_messages');

    const messagesContainer = document.getElementById('messages');
    const usernameInput = document.getElementById('username');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');

    function sendMessage() {
        const name = usernameInput.value.trim() || "Anonymous";
        const text = msgInput.value.trim();
        
        if (text === "") return;

        push(messagesRef, {
            username: name,
            message: text,
            timestamp: Date.now()
        });

        msgInput.value = "";
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    onChildAdded(messagesRef, (data) => {
        const msgData = data.val();
        const msgElement = document.createElement('div');
        msgElement.classList.add('msg');
        
        msgElement.innerHTML = `<div class="name">${escapeHTML(msgData.username)}</div><div>${escapeHTML(msgData.message)}</div>`;
        messagesContainer.appendChild(msgElement);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
</script>

</body>
</html>
