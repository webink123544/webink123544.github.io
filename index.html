<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Личный Сайт</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: translateY(50px);
            opacity: 0;
            animation: fadeInUp 1s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #06b6d4, #3b82f6);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .btn:hover {
            background: #3b82f6;
            box-shadow: 0 0 15px #3b82f6;
            transform: scale(1.03);
        }

        .btn-special {
            background: linear-gradient(45deg, #3b82f6, #8b5cf6);
        }

        .btn-special:hover {
            background: linear-gradient(45deg, #2563eb, #7c3aed);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.6);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">🚀</div>
        <h1>Добро пожаловать!</h1>
        <p>Этот сайт запущен прямо из репозитория GitHub Pages. Всё работает без домашнего хостинга и защищено от DDoS-аток.</p>
        
        <div class="links">
            <a href="https://github.com" target="_blank" class="btn btn-special">Мой Профиль GitHub</a>
            <a href="#" class="btn">Обо мне</a>
            <a href="#" class="btn">Мои проекты</a>
        </div>
    </div>

</body>
</html>
