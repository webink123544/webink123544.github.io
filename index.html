<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Общий Чат</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #111827; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .chat-container { width: 90%; max-width: 600px; height: 80vh; background: #1f2937; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .chat-header { background: #374151; padding: 15px; text-align: center; font-weight: bold; border-bottom: 1px solid #4b5563; }
        .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #4b5563; padding: 10px 15px; border-radius: 8px; max-width: 80%; width: fit-content; word-break: break-all; }
        .msg .name { font-size: 0.8rem; color: #60a5fa; font-weight: bold; margin-bottom: 3px; }
        .input-area { display: flex; padding: 15px; background: #374151; gap: 10px; }
        input { flex: 1; padding: 12px; border: none; border-radius: 6px; background: #1f2937; color: #fff; outline: none; }
        button { padding: 12px 24px; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🌐 Один большой онлайн-чат</div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
        <input type="text" id="username" placeholder="Ваше имя" style="max-width: 120px;">
        <input type="text" id="msgInput" placeholder="Введите сообщение...">
        <button id="sendBtn">Отправить</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // Ваши данные из Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDFzJR2Yg2Z5VS5PEX7S8fDBTS8J49hfJM",
        authDomain: "chatprojecttest-fed60.firebaseapp.com",
        
        // ВАЖНО: Вставьте сюда ссылку на вашу базу данных! (Смотрите инструкцию ниже)
        databaseURL: "https://chatprojecttest-fed60-default-rtdb.firebaseio.com/", 
        
        projectId: "chatprojecttest-fed60",
        storageBucket: "chatprojecttest-fed60.firebasestorage.app",
        messagingSenderId: "888428258274",
        appId: "1:888428258274:web:bc3a453ba34208992f4fbb",
        measurementId: "G-GTY7Y12J65"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'global_messages');

    const messagesContainer = document.getElementById('messages');
    const usernameInput = document.getElementById('username');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');

    function sendMessage() {
        const name = usernameInput.value.trim() || "Аноним";
        const text = msgInput.value.trim();
        
        if (text === "") return;

        push(messagesRef, {
            username: name,
            message: text,
            timestamp: Date.now()
        });

        msgInput.value = "";
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    onChildAdded(messagesRef, (data) => {
        const msgData = data.val();
        const msgElement = document.createElement('div');
        msgElement.classList.add('msg');
        
        msgElement.innerHTML = `<div class="name">${escapeHTML(msgData.username)}</div><div>${escapeHTML(msgData.message)}</div>`;
        messagesContainer.appendChild(msgElement);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
</script>

</body>
</html>
